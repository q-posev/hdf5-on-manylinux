name: ci

on:
  push:
    branches:
      - 'main'

jobs:
  docker_x86:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4       
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push 2014_x86_64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_2014_x86_64
          platforms: linux/amd64
          push: true
          tags: ghcr.io/q-posev/hdf5_1_12_on_2014_x86_64:latest
      -
        name: Build and push 2_28_x86_64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_2_28_x86_64
          platforms: linux/amd64
          push: true
          tags: ghcr.io/q-posev/hdf5_1_12_on_2_28_x86_64:latest

  docker_arm:
    runs-on: ubuntu-22.04-arm
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4       
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push 2014_aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_2014_aarch64
          platforms: linux/arm64
          push: true
          tags: ghcr.io/q-posev/hdf5_1_12_on_2014_aarch64:latest
      -
        name: Build and push 2_28_aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_2_28_aarch64
          platforms: linux/arm64
          push: true
          tags: ghcr.io/q-posev/hdf5_1_12_on_2_28_aarch64:latest